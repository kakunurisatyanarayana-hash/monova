# One-time: creates the release signing key for MONOVA and gives it to you as a downloadable artifact.
# Run it once from the Actions tab, download "release-signing-key", add the three secrets it lists,
# then delete the artifact. Keep the key safe: every future update must be signed with the same key.
name: Make release signing key (run once)

on:
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Create the keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore monova-release.jks -storetype PKCS12 -alias monova \
            -keyalg RSA -keysize 2048 -validity 20000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=MONOVA, O=MONOVA" 
          base64 -w 0 monova-release.jks > keystore-base64.txt
          {
            echo "Add these three repository secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64 = the whole content of keystore-base64.txt"
            echo "ANDROID_KEYSTORE_PASSWORD = $PASS"
            echo "ANDROID_KEY_PASSWORD = $PASS"
            echo "ANDROID_KEY_ALIAS = monova"
          } > SECRETS-README.txt

      - name: Upload the key (download it once, then delete this artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-signing-key
          path: |
            keystore-base64.txt
            SECRETS-README.txt
          retention-days: 1
