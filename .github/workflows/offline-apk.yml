# Builds the offline MONOVA tools APK in the cloud (GitHub-hosted Linux runner).
# No Android Studio, Developer Mode or local licence acceptance is needed on your PC.
# Run it from the GitHub "Actions" tab (Run workflow), then download "monova-offline-apk" from the run's Artifacts.
name: Offline tools APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java (needed by Android Gradle builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build offline release APK
        run: flutter build apk --release --dart-define=MONOVA_OFFLINE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monova-offline-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
