# Builds the offline MONOVA tools APK in the cloud (GitHub-hosted Linux runner).
# No Android Studio, Developer Mode or local licence acceptance is needed on your PC.
# Run it from the GitHub "Actions" tab (Run workflow), then download "monova-offline-apk" from the run's Artifacts.
name: Offline tools APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java (needed by Android Gradle builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Restore the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release key in the repository secrets: this APK is signed with the debug key and cannot update an installed copy."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/monova-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/monova-release.jks" >> "$GITHUB_ENV"

      - name: Build offline release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Gradle downloads are sometimes rate-limited (HTTP 429) on the build machine; retry instead of failing at once.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define=MONOVA_OFFLINE=true --dart-define=BUILD_REF=${{ github.ref_name }} --dart-define=BUILD_COMMIT=${{ github.sha }} && exit 0
            echo "Attempt $attempt failed. Waiting before trying again."
            sleep $((attempt * 60))
          done
          exit 1

      - name: Build offline web app
        run: flutter build web --release --dart-define=MONOVA_OFFLINE=true

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: monova-offline-web
          path: mobile/build/web
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monova-offline-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
